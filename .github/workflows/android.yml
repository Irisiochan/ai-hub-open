name: android-apk

# 云端出 APK：本机网络走 Tailscale 出口节点下不动 Android 工具链，
# 所以原生工程每次由 CI 现场生成（cap add）+ 打补丁 + 构建。
# 未配置签名 secrets 时会生成仅用于本次构建的 keystore，不导出签名凭据。
# 如需手机上可覆盖升级，请预先配置固定的 ANDROID_KEYSTORE_B64/
# ANDROID_KEYSTORE_PASSWORD 两个 repo secrets，让所有 APK 使用同一签名。

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web frontend
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Generate Android project
        run: |
          cp -r web/dist mobile/www
          cd mobile
          npm ci
          npx cap add android

      - name: App icon
        working-directory: mobile
        run: |
          if [ -f assets/logo.png ]; then
            npx --yes @capacitor/assets generate --android \
              --iconBackgroundColor '#e8620a' --iconBackgroundColorDark '#e8620a' \
              --splashBackgroundColor '#16161e' --splashBackgroundColorDark '#16161e' \
              || echo "::warning::icon generation failed, keeping default icon"
          fi

      - name: Patch native project
        working-directory: mobile
        run: |
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p mobile/keys
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > mobile/keys/release.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            PW=$(openssl rand -hex 24)
            keytool -genkeypair -keystore mobile/keys/release.keystore -storetype PKCS12 \
              -alias aihub -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$PW" -keypass "$PW" -dname "CN=ai-hub"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "::warning::no signing secrets — generated a temporary keystore for this build only; configure stable secrets ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD for APK updates"
          fi

      - name: Build APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/mobile/keys/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: aihub
          ANDROID_KEY_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ai-hub.apk"
          {
            echo '### APK'
            ls -la "$GITHUB_WORKSPACE/ai-hub.apk"
            sha256sum "$GITHUB_WORKSPACE/ai-hub.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package web OTA bundle
        run: |
          WEB_VERSION="${GITHUB_SHA::12}"
          (
            cd web/dist
            zip -qr "$GITHUB_WORKSPACE/web-$WEB_VERSION.zip" .
          )
          sha256sum "$GITHUB_WORKSPACE/web-$WEB_VERSION.zip" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-hub-apk
          path: ai-hub.apk
          retention-days: 14

      - name: Upload embedded web bundle
        uses: actions/upload-artifact@v4
        with:
          name: ai-hub-web-bundle
          path: web-*.zip
          retention-days: 14
